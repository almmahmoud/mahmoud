<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown to 12</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  font-family: 'Poppins', Arial, sans-serif;
  color: #fff;
  text-align: center;
  overflow: hidden;
}

.container {
  position: relative;
  z-index: 5;
  background: rgba(255, 255, 255, 0.12);
  padding: 35px 45px;
  border-radius: 25px;
  box-shadow: 0 20px 45px rgba(0,0,0,0.5);
  animation: fadeIn 1.5s ease;
}

h1 {
  font-size: 2.3rem;
  margin-bottom: 20px;
  color: #ffd369;
  text-shadow: 0 0 20px rgba(255,211,105,0.8);
}

.countdown {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
}

.time-box {
  background: rgba(0, 0, 0, 0.35);
  padding: 18px 22px;
  border-radius: 18px;
  min-width: 95px;
  animation: float 3s ease-in-out infinite;
  border: 1px solid rgba(255,255,255,0.2);
}

.time-box span {
  display: block;
  font-size: 2.1rem;
  font-weight: bold;
  color: #00ffcc;
}

.label {
  font-size: 0.85rem;
  margin-top: 5px;
  color: #ddd;
}

.message {
  font-size: 2.6rem;
  margin-top: 20px;
  color: #00ffcc;
  animation: pop 1s infinite alternate;
}

/* Animations */
@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes float {
  0% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
  100% { transform: translateY(0); }
}

@keyframes pop {
  from { transform: scale(1); }
  to { transform: scale(1.1); }
}

/* 🎈 Balloons */
.balloon {
  position: fixed;
  bottom: -120px;
  width: 55px;
  height: 75px;
  background: linear-gradient(135deg, #00ffcc, #00bfa6);
  border-radius: 50% 50% 45% 45%;
  animation: fly 10s linear infinite;
  z-index: 1;
  opacity: 0.9;
}

.balloon::after {
  content: '';
  position: absolute;
  bottom: -25px;
  left: 50%;
  width: 2px;
  height: 30px;
  background: rgba(255,255,255,0.6);
}

@keyframes fly {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-120vh); opacity: 0; }
}
</style>
</head>

<body>

<div class="container">
  <h1>⏳ Countdown to 12 ⏳</h1>

  <div id="countdown" class="countdown">
    <div class="time-box">
      <span id="hours">0</span>
      <div class="label">Hours</div>
    </div>
    <div class="time-box">
      <span id="minutes">0</span>
      <div class="label">Minutes</div>
    </div>
    <div class="time-box">
      <span id="seconds">0</span>
      <div class="label">Seconds</div>
    </div>
  </div>

  <div id="message"></div>
</div>

<script>
// ⏰ تحديد أقرب ساعة 12
function getNextMidnight() {
  const now = new Date();
  const target = new Date();

  // الهدف: 12 بالليل
  target.setHours(0, 0, 0, 0);

  // لو عدينا 12 بالليل → نحسب لبكرة
  if (now >= target) {
    target.setDate(target.getDate() + 1);
  }

  return target;
}

const targetTime = getNextMidnight();

function updateCountdown() {
  const now = new Date().getTime();
  const distance = targetTime.getTime() - now;

  if (distance <= 0) {
    document.getElementById("countdown").style.display = "none";
    document.getElementById("message").innerHTML = "🎉 It’s Midnight! 🎉";
    document.getElementById("message").className = "message";
    return;
  }

  const hours = Math.floor(
    (distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)
  );

  const minutes = Math.floor(
    (distance % (1000 * 60 * 60)) / (1000 * 60)
  );

  const seconds = Math.floor(
    (distance % (1000 * 60)) / 1000
  );

  document.getElementById("hours").innerText = hours;
  document.getElementById("minutes").innerText = minutes;
  document.getElementById("seconds").innerText = seconds;
}

// تشغيل العدّ
updateCountdown();
setInterval(updateCountdown, 1000);

// 🎈 Balloons
function createBalloon() {
  const balloon = document.createElement("div");
  balloon.className = "balloon";
  balloon.style.left = Math.random() * 100 + "vw";
  balloon.style.animationDuration = (Math.random() * 4 + 6) + "s";
  document.body.appendChild(balloon);
  setTimeout(() => balloon.remove(), 12000);
}
setInterval(createBalloon, 600);
</script>

</body>
</html>
